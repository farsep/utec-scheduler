# GitLab CI/CD Pipeline for Astro + pnpm GitLab Pages Deployment

image: node:26-bookworm

variables:
  # Tour/audit .mp4 recordings are tracked in Git LFS and not used to build the site.
  # Skipping LFS smudge speeds up CI clones and prevents mirror LFS failures.
  GIT_LFS_SKIP_SMUDGE: "1"

stages:
  - deploy

pages:
  stage: deploy
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    # Install Rust and wasm-pack
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - . "$HOME/.cargo/env"
    - curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
    # Setup pnpm matching package.json "packageManager" (Node 26 no longer bundles Corepack)
    - PNPM_SPEC=$(node -p 'require("./package.json").packageManager.split("+")[0]')
    - npm install -g "$PNPM_SPEC"
    - pnpm --version
  script:
    # Run Rust unit tests and build WASM first
    - cd wasm-engine
    - cargo test --lib
    - wasm-pack build --target web
    - cd ..
    # Install dependencies, typecheck, and build Astro app
    - pnpm install --frozen-lockfile --store-dir .pnpm-store
    - pnpm run check
    - pnpm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
