[package]
name = "wasm-engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.84"
js-sys = "0.3.61"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-futures = "0.4.40"
gloo-timers = { version = "0.3.0", features = ["futures"] }
